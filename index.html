<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliê — Galeria de Bordados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0e0b09;
  --surface:  #171210;
  --card:     #1e1812;
  --border:   rgba(255,255,255,0.07);
  --border-h: rgba(255,255,255,0.14);
  --gold:     #c9a96e;
  --gold-lt:  #e2c998;
  --gold-dk:  #8a6e3e;
  --text:     #f0e8df;
  --text-soft:#b8a898;
  --text-mute:#6e5f52;
  --shadow:   rgba(0,0,0,0.5);
  --radius:   16px;
  --radius-sm:10px;
  --serif:    'Playfair Display', Georgia, serif;
  --sans:     'Jost', system-ui, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.65;
  overflow-x: hidden;
}

/* grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.025;
  pointer-events: none;
  z-index: 9999;
}

/* Header */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(14,11,9,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(1rem,5vw,3rem);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; height: 64px;
}
.brand { display: flex; align-items: baseline; gap: 0.6rem; text-decoration: none; }
.brand-name { font-family: var(--serif); font-size: 1.4rem; font-weight: 400; color: var(--gold); letter-spacing: 0.05em; }
.brand-sub  { font-size: 0.72rem; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mute); }

/* Search */
.search-wrap { position: relative; flex: 1; max-width: 340px; }
.search-wrap svg { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-mute); pointer-events: none; }
.search-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 0.5rem 1rem 0.5rem 2.5rem;
  color: var(--text);
  font-family: var(--sans); font-size: 0.85rem; font-weight: 300; letter-spacing: 0.02em;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.search-input::placeholder { color: var(--text-mute); }
.search-input:focus { outline: none; border-color: var(--gold-dk); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 3px rgba(201,169,110,0.12); }

/* Hero */
.hero {
  text-align: center;
  padding: clamp(3rem,8vw,6rem) clamp(1rem,5vw,3rem) clamp(2rem,5vw,4rem);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(201,169,110,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; opacity: 0; animation: fadeUp 0.7s 0.1s ease forwards; }
.hero-title   { font-family: var(--serif); font-size: clamp(2.4rem,7vw,5rem); font-weight: 400; line-height: 1.15; color: var(--text); margin-bottom: 1rem; opacity: 0; animation: fadeUp 0.7s 0.22s ease forwards; }
.hero-title em { font-style: italic; color: var(--gold-lt); }
.hero-desc    { font-size: clamp(0.875rem,2vw,1rem); font-weight: 300; color: var(--text-soft); max-width: 480px; margin: 0 auto; opacity: 0; animation: fadeUp 0.7s 0.34s ease forwards; }
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

/* Filter bar */
.filter-bar { padding: 0 clamp(1rem,5vw,3rem) 1.5rem; display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-pill {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.42rem 1rem; border-radius: 40px; border: 1px solid var(--border);
  background: transparent; color: var(--text-soft);
  font-family: var(--sans); font-size: 0.82rem; font-weight: 400; letter-spacing: 0.03em;
  cursor: pointer; white-space: nowrap; transition: all 0.2s ease; flex-shrink: 0;
}
.filter-pill:hover { border-color: var(--border-h); color: var(--text); background: rgba(255,255,255,0.04); }
.filter-pill.active { background: var(--gold); border-color: var(--gold); color: #1a1208; font-weight: 500; }
.filter-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.filter-pill.active .dot { background: rgba(0,0,0,0.3); }

/* Gallery */
.gallery-wrap { padding: 0 clamp(1rem,5vw,3rem) 4rem; }
.gallery-count { font-size: 0.75rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 1.5rem; }

.gallery-grid { columns: 3; column-gap: 1.25rem; }
@media (max-width: 900px) { .gallery-grid { columns: 2; } }
@media (max-width: 520px)  { .gallery-grid { columns: 1; } }

.gallery-item {
  break-inside: avoid; margin-bottom: 1.25rem;
  border-radius: var(--radius); overflow: hidden;
  background: var(--card); border: 1px solid var(--border);
  cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  position: relative; opacity: 0; animation: cardIn 0.5s ease forwards;
}
.gallery-item:hover { transform: translateY(-4px); box-shadow: 0 20px 48px var(--shadow), 0 0 0 1px var(--border-h); border-color: var(--border-h); }
@keyframes cardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.gallery-item:nth-child(1) { animation-delay:0.05s } .gallery-item:nth-child(2) { animation-delay:0.10s }
.gallery-item:nth-child(3) { animation-delay:0.15s } .gallery-item:nth-child(4) { animation-delay:0.20s }
.gallery-item:nth-child(5) { animation-delay:0.25s } .gallery-item:nth-child(6) { animation-delay:0.30s }
.gallery-item:nth-child(7) { animation-delay:0.35s } .gallery-item:nth-child(8) { animation-delay:0.40s }
.gallery-item:nth-child(n+9){ animation-delay:0.45s }
.gallery-item::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(201,169,110,0.04) 0%,transparent 60%); opacity:0; transition:opacity 0.25s; pointer-events:none; border-radius:var(--radius); }
.gallery-item:hover::after { opacity:1; }

.gallery-img { width:100%; display:block; object-fit:cover; }
.gallery-img-placeholder { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1a1410 0%,#221c14 100%); font-size:2.5rem; opacity:0.4; }
.gallery-body { padding: 1rem 1.1rem 1.1rem; }
.gallery-cat-label { display:flex; align-items:center; gap:0.4rem; font-size:0.68rem; font-weight:500; letter-spacing:0.13em; text-transform:uppercase; color:var(--text-mute); margin-bottom:0.45rem; }
.gallery-name { font-family:var(--serif); font-size:1.15rem; font-weight:400; color:var(--text); line-height:1.3; margin-bottom:0.4rem; }
.gallery-desc { font-size:0.81rem; font-weight:300; color:var(--text-soft); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.gallery-file-count { margin-top:0.6rem; font-size:0.72rem; color:var(--gold-dk); display:flex; align-items:center; gap:0.3rem; }

/* Empty */
.empty { text-align:center; padding:5rem 2rem; color:var(--text-mute); }
.empty-icon { font-size:3rem; opacity:0.3; margin-bottom:1.2rem; }
.empty h3 { font-family:var(--serif); font-size:1.5rem; font-weight:400; font-style:italic; color:var(--text-soft); margin-bottom:0.5rem; }
.empty p { font-size:0.875rem; }

/* Lightbox */
.lightbox { position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; padding:1rem; animation:lbIn 0.22s ease; }
@keyframes lbIn { from { opacity:0; } }
.lb-backdrop { position:absolute; inset:0; background:rgba(8,6,4,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); cursor:zoom-out; }
.lb-panel {
  position:relative; z-index:1;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  max-width:820px; width:100%; max-height:92vh; overflow-y:auto;
  box-shadow:0 40px 100px rgba(0,0,0,0.7);
  animation:lbSlide 0.25s ease;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
@keyframes lbSlide { from { transform:scale(0.96) translateY(12px); } }
.lb-image-wrap { position:relative; background:#111; }
.lb-image { width:100%; max-height:55vh; object-fit:contain; display:block; }
.lb-image-placeholder { width:100%; height:260px; display:flex; align-items:center; justify-content:center; font-size:4rem; opacity:0.2; background:linear-gradient(135deg,#111 0%,#1a1510 100%); }
.lb-close { position:absolute; top:0.75rem; right:0.75rem; background:rgba(0,0,0,0.6); border:1px solid var(--border); color:var(--text-soft); border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1rem; line-height:1; transition:all 0.15s; z-index:2; }
.lb-close:hover { background:rgba(255,255,255,0.1); color:var(--text); }
.lb-body { padding:1.5rem 1.75rem 2rem; }
.lb-meta { display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.75rem; }
.lb-cat-tag { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.72rem; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-mute); border:1px solid var(--border); padding:0.2rem 0.65rem; border-radius:20px; }
.lb-date-tag { font-size:0.72rem; color:var(--text-mute); letter-spacing:0.05em; }
.lb-title { font-family:var(--serif); font-size:clamp(1.6rem,4vw,2.2rem); font-weight:400; line-height:1.2; color:var(--text); margin-bottom:0.75rem; }
.lb-desc  { font-size:0.9rem; font-weight:300; color:var(--text-soft); line-height:1.75; margin-bottom:1.25rem; }
.lb-divider { border:none; border-top:1px solid var(--border); margin:1.25rem 0; }
.lb-files-title { font-size:0.68rem; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-mute); margin-bottom:0.75rem; }
.lb-files { display:flex; flex-direction:column; gap:0.5rem; }
.lb-file-link { display:flex; align-items:center; gap:0.65rem; padding:0.65rem 1rem; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-soft); text-decoration:none; font-size:0.85rem; font-weight:300; transition:all 0.18s; }
.lb-file-link:hover { background:rgba(201,169,110,0.08); border-color:var(--gold-dk); color:var(--gold-lt); }
.lb-file-link svg { color:var(--gold-dk); flex-shrink:0; }
.lb-file-link .lb-file-name { flex:1; }
.lb-file-link .lb-arrow { font-size:0.75rem; opacity:0.5; transition:opacity 0.15s,transform 0.15s; }
.lb-file-link:hover .lb-arrow { opacity:1; transform:translateX(2px); }

/* Nav arrows */
.lb-nav { position:absolute; top:50%; transform:translateY(-50%); z-index:10; background:rgba(0,0,0,0.5); border:1px solid var(--border); border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-soft); transition:all 0.15s; }
.lb-nav:hover { background:rgba(255,255,255,0.1); color:var(--text); }
.lb-nav-prev { left:-52px; }
.lb-nav-next { right:-52px; }
@media (max-width:960px) { .lb-nav { display:none; } }

/* Swipe hint on mobile */
.lb-swipe-hint { text-align:center; padding:0.6rem; font-size:0.72rem; color:var(--text-mute); letter-spacing:0.06em; border-top:1px solid var(--border); }
@media (min-width:961px) { .lb-swipe-hint { display:none; } }

/* Footer */
footer { text-align:center; padding:2rem; color:var(--text-mute); font-size:0.78rem; font-weight:300; letter-spacing:0.05em; border-top:1px solid var(--border); }
footer a { color:var(--gold-dk); text-decoration:none; transition:color 0.15s; }
footer a:hover { color:var(--gold); }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#" class="brand">
      <span class="brand-name">Ateliê</span>
      <span class="brand-sub">bordados</span>
    </a>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" type="search" id="searchInput" placeholder="Pesquisar bordados…" oninput="Gallery.filter()">
    </div>
  </div>
</header>

<section class="hero">
  <p class="hero-eyebrow">Coleção de bordados</p>
  <h1 class="hero-title">Rick bordados</h1>
  <p class="hero-desc" id="heroDesc">Carregando coleção…</p>
</section>

<div class="filter-bar" id="filterBar"></div>

<div class="gallery-wrap">
  <p class="gallery-count" id="galleryCount"></p>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<footer>
  <p>Galeria de visualização · <a href="admin.html">Abrir painel de administração</a></p>
</footer>

<div id="lightboxRoot"></div>

<script>
const Data = {
  categories: [], designs: [],
  async load() {
    try {
      const [cr,dr] = await Promise.all([
        fetch('data/categories.json?t='+Date.now()),
        fetch('data/designs.json?t='+Date.now())
      ]);
      if (cr.ok) this.categories = await cr.json();
      if (dr.ok) this.designs    = await dr.json();
    } catch(e) {
      try {
        const lc = localStorage.getItem('bordado_categories');
        const ld = localStorage.getItem('bordado_designs');
        if (lc) this.categories = JSON.parse(lc);
        if (ld) this.designs    = JSON.parse(ld);
      } catch(e2) {}
    }
  },
  getCat(id) { return this.categories.find(c => c.id === id); },
  getFiles(d) {
    if (Array.isArray(d.files) && d.files.length) return d.files;
    if (d.file) return [{ name: 'Arquivo', path: d.file }];
    return [];
  }
};

const Gallery = {
  activeCategory: 'all',
  currentItems: [],
  lightboxIndex: 0,

  async init() {
    await Data.load();
    this.renderHero();
    this.renderFilters();
    this.renderGallery();
  },

  renderHero() {
    const t = Data.designs.length, c = Data.categories.length;
    document.getElementById('heroDesc').textContent = t
      ? t + ' bordado' + (t!==1?'s':'') + ' em ' + c + ' categoria' + (c!==1?'s':'')
      : 'A coleção ainda não tem bordados.';
  },

  renderFilters() {
    const bar = document.getElementById('filterBar');
    const all = '<button class="filter-pill active" data-id="all" onclick="Gallery.selectCat(\'all\',this)">Todos</button>';
    const cats = Data.categories.map(c => {
      const count = Data.designs.filter(d => d.categoryId === c.id).length;
      return '<button class="filter-pill" data-id="' + c.id + '" onclick="Gallery.selectCat(\'' + c.id + '\',this)">'
        + '<span class="dot" style="background:' + c.color + '"></span>'
        + esc(c.name)
        + '<span style="opacity:0.5;font-size:0.75em">' + count + '</span>'
        + '</button>';
    }).join('');
    bar.innerHTML = all + cats;
  },

  selectCat(id, el) {
    this.activeCategory = id;
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    this.renderGallery();
  },

  getFiltered() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    return Data.designs.filter(d => {
      const matchCat = this.activeCategory === 'all' || d.categoryId === this.activeCategory;
      const matchQ   = !q || d.name.toLowerCase().includes(q) || (d.description||'').toLowerCase().includes(q);
      return matchCat && matchQ;
    });
  },

  filter() { this.renderGallery(); },

  renderGallery() {
    this.currentItems = this.getFiltered();
    const grid  = document.getElementById('galleryGrid');
    const count = document.getElementById('galleryCount');

    count.textContent = this.currentItems.length
      ? this.currentItems.length + ' bordado' + (this.currentItems.length!==1?'s':'')
      : '';

    if (!this.currentItems.length) {
      grid.innerHTML = '<div class="empty" style="column-span:all"><div class="empty-icon">🪡</div><h3>Nenhum bordado encontrado</h3><p>Tente outro filtro ou termo de pesquisa.</p></div>';
      return;
    }

    grid.innerHTML = this.currentItems.map((d,i) => {
      const cat   = Data.getCat(d.categoryId);
      const files = Data.getFiles(d);
      const img   = d.image
        ? '<img src="' + esc(d.image) + '" alt="' + esc(d.name) + '" class="gallery-img" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
          + '<div class="gallery-img-placeholder" style="display:none">🧵</div>'
        : '<div class="gallery-img-placeholder">🧵</div>';
      const catLine = cat
        ? '<div class="gallery-cat-label"><span style="width:6px;height:6px;border-radius:50%;background:' + cat.color + ';display:inline-block"></span>' + esc(cat.name) + '</div>'
        : '';
      const descLine = d.description ? '<p class="gallery-desc">' + esc(d.description) + '</p>' : '';
      const fileHint = files.length
        ? '<div class="gallery-file-count"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + files.length + ' arquivo' + (files.length!==1?'s':'') + '</div>'
        : '';
      return '<article class="gallery-item" onclick="Gallery.openLightbox(' + i + ')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')Gallery.openLightbox(' + i + ')">'
        + img
        + '<div class="gallery-body">' + catLine + '<h2 class="gallery-name">' + esc(d.name) + '</h2>' + descLine + fileHint + '</div>'
        + '</article>';
    }).join('');
  },

  openLightbox(index) {
    this.lightboxIndex = index;
    this._renderLightbox();
  },

  _renderLightbox() {
    const d     = this.currentItems[this.lightboxIndex];
    if (!d) return;
    const cat   = Data.getCat(d.categoryId);
    const files = Data.getFiles(d);
    const total = this.currentItems.length;
    const idx   = this.lightboxIndex;

    const imgBlock = d.image
      ? '<img src="' + esc(d.image) + '" alt="' + esc(d.name) + '" class="lb-image" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        + '<div class="lb-image-placeholder" style="display:none">🧵</div>'
      : '<div class="lb-image-placeholder">🧵</div>';

    const catTag = cat
      ? '<span class="lb-cat-tag"><span style="width:7px;height:7px;border-radius:50%;background:' + cat.color + ';display:inline-block"></span>' + esc(cat.name) + '</span>'
      : '';
    const dateTag = d.createdAt ? '<span class="lb-date-tag">📅 ' + d.createdAt + '</span>' : '';

    const filesBlock = files.length
      ? '<hr class="lb-divider"><p class="lb-files-title">Arquivos vinculados</p><div class="lb-files">'
        + files.map(f => '<a href="' + esc(f.path) + '" target="_blank" rel="noopener" class="lb-file-link">'
          + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
          + '<span class="lb-file-name">' + esc(f.name || f.path.split('/').pop()) + '</span>'
          + '<span class="lb-arrow">→</span>'
          + '</a>').join('')
        + '</div>'
      : '';

    const navPrev = idx > 0
      ? '<button class="lb-nav lb-nav-prev" onclick="Gallery._navLb(-1)" title="Anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>'
      : '';
    const navNext = idx < total-1
      ? '<button class="lb-nav lb-nav-next" onclick="Gallery._navLb(1)" title="Próximo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>'
      : '';

    const counter = total > 1 ? (idx+1) + ' de ' + total : '';
    const swipe   = total > 1 ? '<p class="lb-swipe-hint">← deslize para navegar →</p>' : '';

    document.getElementById('lightboxRoot').innerHTML =
      '<div class="lightbox" role="dialog" aria-modal="true">'
      + '<div class="lb-backdrop" onclick="Gallery.closeLightbox()"></div>'
      + navPrev
      + '<div class="lb-panel">'
        + '<div class="lb-image-wrap">' + imgBlock
          + '<button class="lb-close" onclick="Gallery.closeLightbox()" aria-label="Fechar">✕</button>'
        + '</div>'
        + '<div class="lb-body">'
          + '<div class="lb-meta">' + catTag + dateTag
            + (counter ? '<span class="lb-date-tag" style="margin-left:auto">' + counter + '</span>' : '')
          + '</div>'
          + '<h2 class="lb-title">' + esc(d.name) + '</h2>'
          + (d.description ? '<p class="lb-desc">' + esc(d.description) + '</p>' : '')
          + filesBlock
        + '</div>'
        + swipe
      + '</div>'
      + navNext
      + '</div>';

    document.body.style.overflow = 'hidden';
  },

  _navLb(dir) {
    const next = this.lightboxIndex + dir;
    if (next >= 0 && next < this.currentItems.length) {
      this.lightboxIndex = next;
      this._renderLightbox();
    }
  },

  closeLightbox() {
    document.getElementById('lightboxRoot').innerHTML = '';
    document.body.style.overflow = '';
  }
};

document.addEventListener('keydown', e => {
  if (!document.querySelector('.lightbox')) return;
  if (e.key === 'Escape')      Gallery.closeLightbox();
  if (e.key === 'ArrowLeft')   Gallery._navLb(-1);
  if (e.key === 'ArrowRight')  Gallery._navLb(1);
});

let _tx = null;
document.addEventListener('touchstart', e => { if (document.querySelector('.lightbox')) _tx = e.touches[0].clientX; });
document.addEventListener('touchend',   e => {
  if (_tx === null || !document.querySelector('.lightbox')) return;
  const dx = e.changedTouches[0].clientX - _tx;
  if (Math.abs(dx) > 50) Gallery._navLb(dx < 0 ? 1 : -1);
  _tx = null;
});

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

Gallery.init();
</script>
</body>
</html>
